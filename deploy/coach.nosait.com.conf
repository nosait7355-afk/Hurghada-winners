# nginx site for the Flutter web build of My Coach.
# Served at coach.nosait.com from /var/www/my-coach-web — a directory of its
# own, unrelated to any other site on this host.
#
# Certbot appends the listen 443 / ssl_certificate lines to this file the first
# time it runs for the domain, so keep it as the plain HTTP block until then.

server {
    listen 80;
    listen [::]:80;
    server_name coach.nosait.com;

    root /var/www/my-coach-web;
    index index.html;

    # gzip_types is commented out in nginx.conf, so without this only text/html
    # is compressed and the bundle ships at ~14MB instead of ~5MB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Flutter's web output carries no content hash in its filenames — every
    # build writes main.dart.js again under the same name. Caching these
    # without revalidation pins visitors to the previous bundle, so they are
    # explicitly excluded from the long-cache rule below.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Bundled assets change with the app, so they revalidate too. They are
    # small and 304s are cheap.
    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # canvaskit only changes when the Flutter SDK does — safe to cache.
    # Set the whole value in one add_header: `expires` emits a Cache-Control
    # of its own, so pairing the two sends the header twice.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback: deep links like /player-join-request are client-side routes
    # with no file behind them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/coach.nosait.com.access.log;
    error_log  /var/log/nginx/coach.nosait.com.error.log;
}
